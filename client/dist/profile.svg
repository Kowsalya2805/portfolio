<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99B73" />
      <stop offset="100%" stop-color="#B87B56" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Subtle Grid Lines in Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Avatar Clip Path for circular framing -->
  <clipPath id="circleClip">
    <circle cx="250" cy="250" r="224" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Shoulders & Executive Blazer -->
    <path d="M 120 460 Q 250 360 380 460 L 420 500 L 80 500 Z" fill="url(#suitGrad)" />
    
    <!-- White Collared Shirt -->
    <path d="M 205 340 L 250 420 L 295 340 L 275 320 L 250 345 L 225 320 Z" fill="#FFFFFF" />
    
    <!-- Blazer Lapels -->
    <path d="M 170 450 L 225 320 L 250 430 L 160 500 Z" fill="#0F172A" />
    <path d="M 330 450 L 275 320 L 250 430 L 340 500 Z" fill="#0F172A" />

    <!-- Neck -->
    <path d="M 220 270 L 280 270 L 280 330 L 220 330 Z" fill="url(#skinGrad)" />

    <!-- Face Shape -->
    <path d="M 180 180 C 180 120, 320 120, 320 180 C 320 270, 180 270, 180 180 Z" fill="url(#skinGrad)" filter="url(#shadow)" />

    <!-- Hair Tied Back -->
    <path d="M 175 170 C 175 100, 325 100, 325 170 C 325 130, 300 110, 250 110 C 200 110, 175 130, 175 170 Z" fill="#1C1917" />
    <path d="M 175 170 Q 185 220 180 250 Q 170 200 175 170 Z" fill="#1C1917" />
    <path d="M 325 170 Q 315 220 320 250 Q 330 200 325 170 Z" fill="#1C1917" />

    <!-- Eyes & Brows -->
    <!-- Left Eye -->
    <ellipse cx="215" cy="185" rx="10" ry="6" fill="#FFFFFF" />
    <circle cx="215" cy="185" r="4" fill="#1C1917" />
    <path d="M 200 172 Q 215 168 230 172" stroke="#1C1917" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Right Eye -->
    <ellipse cx="285" cy="185" rx="10" ry="6" fill="#FFFFFF" />
    <circle cx="285" cy="185" r="4" fill="#1C1917" />
    <path d="M 270 172 Q 285 168 300 172" stroke="#1C1917" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Bindi Accent -->
    <circle cx="250" cy="165" r="2.5" fill="#DC2626" />

    <!-- Nose & Mouth -->
    <path d="M 250 185 Q 247 205 253 205" stroke="#9A3412" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 235 225 Q 250 238 265 225" stroke="#B91C1C" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Small Earring Studs -->
    <circle cx="178" cy="200" r="3" fill="#E2E8F0" />
    <circle cx="322" cy="200" r="3" fill="#E2E8F0" />
  </g>
</svg>
